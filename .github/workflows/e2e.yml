# Real-sandbox smoke test: builds the E2B template from the PR's template.ts
# under a CI-scoped name, then runs test.ts (mount, write, read-back, mountless
# verify). Costs E2B sandbox time + TiDB Cloud FS quota per run.
#
# Fork PRs never receive repo secrets on plain `pull_request` events, so this
# workflow uses `pull_request_target` gated on the `run-e2e` label: a maintainer
# adds the label to approve running PR code with secrets. Label-gating is the
# standard mitigation — never remove it. push (main) and workflow_dispatch run
# trusted code only.
name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: github.event_name != 'pull_request_target' || contains(github.event.pull_request.labels.*.name, 'run-e2e')
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      TDC_REGION_CODE: ${{ secrets.TDC_REGION_CODE }}
      TDC_FS_FILE_SYSTEM_NAME: ${{ secrets.TDC_FS_FILE_SYSTEM_NAME }}
      TDC_FS_TOKEN: ${{ secrets.TDC_FS_TOKEN }}
    steps:
      # pull_request_target defaults to the base ref — check out the PR head
      # explicitly so the code under test is the code being reviewed.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install tdc CLI (needed on the runner for mountless verification)
        run: |
          curl -fsSL https://github.com/tidbcloud/tdc/releases/latest/download/install.sh | sh -s -- --version latest --install-dir /usr/local/bin --yes
          tdc --version

      - name: Preflight — required repo secrets
        run: |
          missing=0
          for v in E2B_API_KEY TDC_REGION_CODE TDC_FS_FILE_SYSTEM_NAME TDC_FS_TOKEN; do
            if [ -z "$(printenv "$v")" ]; then
              echo "::error::missing repo secret $v (repo Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit "$missing"

      # Rebuild the template from this ref's template.ts instead of reusing the
      # dev template, so image changes are actually exercised. CI-scoped name
      # keeps the dev template untouched.
      - name: Build E2B template
        env:
          E2B_TEMPLATE_NAME: tidbcloud-fs-ci
        run: pnpm build

      - name: Smoke test (mount, write, read-back, mountless verify)
        env:
          E2B_TEMPLATE_NAME: tidbcloud-fs-ci
        run: pnpm test
